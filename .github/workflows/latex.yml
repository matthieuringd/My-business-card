name: Build and release business card

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: card.tex
          latexmk_use_xelatex: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: card.pdf